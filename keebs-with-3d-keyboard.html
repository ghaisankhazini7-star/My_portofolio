<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KEEBS — Premium Mechanical Keyboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
img,video,canvas{max-width:100%}
html{scroll-behavior:smooth}
:root{
  --bg:#0a0a0a;
  --card:#111;
  --line:#1f1f1f;
  --sub:#444;
  --muted:#666;
  --body:#999;
  --text:#ccc;
  --white:#f0f0f0;
  --accent:#f0f0f0;
  --accent2:#ff4747;
  --ease:cubic-bezier(.16,1,.3,1);
}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--sub)}
nav{position:fixed;top:0;left:0;right:0;z-index:300;border-bottom:1px solid var(--line);background:rgba(10,10,10,.92);backdrop-filter:blur(20px)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 clamp(20px,3.5vw,40px);height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--white);text-decoration:none;letter-spacing:-.5px;display:flex;align-items:center;gap:2px}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:4px}
.nav-link{font-size:13px;color:var(--body);text-decoration:none;padding:6px 14px;border-radius:6px;transition:color .2s,background .2s;font-weight:500}
.nav-link:hover{color:var(--white);background:var(--card)}
.nav-right{display:flex;align-items:center;gap:12px}
.cart-btn{position:relative;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);transition:border-color .2s}
.cart-btn:hover{border-color:var(--accent);color:var(--accent)}
.cart-count{position:absolute;top:-6px;right:-6px;width:18px;height:18px;background:var(--white);color:#0a0a0a;font-size:10px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;opacity:0;transition:opacity .2s,transform .2s;transform:scale(0)}
.cart-count.show{opacity:1;transform:scale(1)}
.hero{min-height:100vh;padding-top:60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;opacity:.4}
.hero-glow{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(240,240,240,.05) 0%,transparent 70%);pointer-events:none}
.hero-content{position:relative;z-index:1;max-width:1200px;margin:0 auto;width:100%;padding:clamp(56px,7vw,80px) clamp(20px,3.5vw,40px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,60px);align-items:center}
.hero-kicker{font-family:'Space Mono',monospace;font-size:11px;color:var(--white);letter-spacing:.15em;text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.hero-kicker::before{content:'';width:24px;height:1px;background:var(--white)}
.hero-h1{font-size:clamp(56px,8vw,120px);font-weight:700;letter-spacing:-4px;line-height:.9;color:var(--white);margin-bottom:32px}
.hero-h1 .outline{-webkit-text-stroke:1px rgba(240,240,240,.3);color:transparent}
.hero-desc{font-size:15px;color:var(--body);line-height:1.8;max-width:360px;margin-bottom:32px}
.hero-stats{display:flex;gap:40px;margin-top:20px}
.hstat{text-align:right}
.hstat-num{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--white);letter-spacing:-1px;line-height:1}
.hstat-lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.hero-3d{position:relative;width:100%;height:400px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.hero-3d canvas{width:100%;height:100%;display:block}
@media(max-width:960px){
  .hero-content{grid-template-columns:1fr;padding:60px 20px}
  .hero-3d{height:300px}
}
@media(max-width:640px){
  .nav-in{padding:0 20px}
  .nav-links{display:none}
  .hero-content{padding:40px 20px;gap:32px}
  .hero-h1{letter-spacing:-2px}
  .hero-desc{font-size:14px}
  .hero-stats{gap:24px;flex-wrap:wrap}
  .hero-3d{height:min(78vw,300px)}
}
</style>
</head>
<body>

<div class="toast" id="toast">Added to cart!</div>
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-head">
    <div class="cart-title">Your Cart <span id="cart-count-title" style="font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);font-weight:400"></span></div>
    <button class="cart-close" onclick="closeCart()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty"><div class="cart-empty-icon">[_]</div><div class="cart-empty-txt">Your cart is empty</div></div>
  </div>
  <div class="cart-foot" id="cartFoot" style="display:none">
    <div class="cart-total"><div class="ct-lbl">Total</div><div class="ct-val" id="cartTotal">$0</div></div>
    <button class="checkout-btn">Checkout →</button>
  </div>
</div>

<nav>
  <div class="nav-in">
    <a href="#" class="logo">KEE<span>BS</span></a>
    <div class="nav-links">
      <a href="#products" class="nav-link">Products</a>
      <a href="#featured" class="nav-link">Featured</a>
      <a href="#about" class="nav-link">About</a>
    </div>
    <div class="nav-right">
      <button class="cart-btn" onclick="openCart()" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <div class="cart-count" id="cartCount">0</div>
      </button>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="hero-bg">
    <div class="hero-grid"></div>
    <div class="hero-glow"></div>
  </div>
  <div class="hero-content">
    <div>
      <div class="hero-kicker">Premium Mechanical Keyboards</div>
      <h1 class="hero-h1">Every<br/>Key<br/><span class="outline">Matters.</span></h1>
      <p class="hero-desc">Handpicked mechanical keyboards for typists, coders, and collectors. Feel the difference with every keystroke.</p>
      <div class="hero-stats">
        <div class="hstat"><div class="hstat-num">40+</div><div class="hstat-lbl">Products</div></div>
        <div class="hstat"><div class="hstat-num">5★</div><div class="hstat-lbl">Rating</div></div>
        <div class="hstat"><div class="hstat-num">2k+</div><div class="hstat-lbl">Customers</div></div>
      </div>
    </div>
    <div class="hero-3d">
      <canvas id="kbCanvas"></canvas>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const c = document.getElementById('kbCanvas');
function resizeCanvas() {
  const box = c.parentElement.getBoundingClientRect();
  const cw = Math.max(1, Math.floor(box.width));
  const ch = Math.max(1, Math.floor(box.height));
  c.width = cw * window.devicePixelRatio;
  c.height = ch * window.devicePixelRatio;
  c.style.width = cw + 'px';
  c.style.height = ch + 'px';
  return {cw, ch};
}

let {cw, ch} = resizeCanvas();

const s = new THREE.Scene();
s.background = null;
const cam = new THREE.PerspectiveCamera(50, cw/ch, 0.1, 100);
cam.position.set(0, 1.5, 4);
const ren = new THREE.WebGLRenderer({canvas:c, antialias:true, alpha:true});
ren.setPixelRatio(Math.min(window.devicePixelRatio, 2));
ren.setSize(cw, ch, false);

s.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(3, 5, 3); s.add(dl);

const kb = new THREE.Group(); s.add(kb);
const caseMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.4, metalness:0.8});
const keyMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.5});
const topMat = new THREE.MeshStandardMaterial({color:0xf0f0f0, roughness:0.3});

function makeKey(w, d, x, z) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(w-0.02, 0.08, d-0.02), keyMat);
  b.position.y = 0.04;
  g.add(b);
  const t = new THREE.Mesh(new THREE.BoxGeometry(w-0.06, 0.04, d-0.06), topMat);
  t.position.y = 0.1;
  g.add(t);
  g.position.set(x, 0.08, z);
  kb.add(g);
}

const kw = 0.3, kd = 0.3, g = 0.05;
for(let r = 0; r < 4; r++) {
  const cnt = 14 - r * 0.5;
  const off = (14 - cnt) * (kw + g) / 2;
  for(let i = 0; i < cnt; i++) {
    makeKey(kw, kd, -2.0 + i * (kw + g) + off, 0.5 - r * (kd + g));
  }
}
const space = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, kd), keyMat);
space.position.set(0, 0.04, -1.6);
kb.add(space);

let ry = 0;
function ani() {
  requestAnimationFrame(ani);
  ry += 0.003;
  kb.rotation.set(0.1, ry, 0);
  ren.render(s, cam);
}
ani();
window.addEventListener('resize', function(){
  const size = resizeCanvas();
  cam.aspect = size.cw / size.ch;
  cam.updateProjectionMatrix();
  ren.setSize(size.cw, size.ch, false);
});
</script>
</body>
</html>
